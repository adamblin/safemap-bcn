<style>
/* ---- Leaflet 1.9.4 (embedded so the app does not depend on a CDN) ---- */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}

    display: flex; flex-direction: column; align-items: center; gap: 8px; transition: border-color .15s, background .15s;
  }
  .lvl:hover { background: var(--surface-2); }
  .lvl .swatch { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
  .lvl[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--bg)); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1.5px solid var(--line); background: var(--bg); border-radius: 18px; padding: 7px 13px; font-size: 13.5px; font-weight: 500; transition: background .15s, border-color .15s;
  }
  .chip:hover { background: var(--surface-2); }
  .chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .seg { display: inline-grid; grid-auto-flow: column; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 8px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 500; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: var(--shadow-1); font-weight: 600; }
  textarea, .field input {
    width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; font: inherit; font-size: 15px;
    background: var(--bg); color: var(--text); resize: vertical; transition: border-color .15s;
  }
  textarea::placeholder, .field input::placeholder { color: var(--muted); }
  textarea:focus, .field input:focus { border-color: var(--focus); outline: none; }
  .counter { text-align: right; font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .btn {
    width: 100%; height: 50px; border: 0; border-radius: var(--r-md); background: var(--brand); color: var(--on-brand); font-weight: 600; font-size: 15px; margin-top: 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, opacity .15s;
  }
  .btn:hover:not(:disabled) { background: var(--brand-hover); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.soft { background: var(--surface-2); color: var(--text); }
  .btn.soft:hover:not(:disabled) { background: var(--surface-3); }

  .route-fields { position: relative; display: grid; gap: 8px; margin-top: 10px; }
  .field { position: relative; display: flex; gap: 8px; align-items: center; }
  .field .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; margin: 0 4px; }
  .field { flex-wrap: wrap; }
  .field input { flex: 1; width: auto; min-width: 0; }
  body:has(#qResults:not(.hidden)) .corner-logo { display: none; }
  .field .results { position: static; flex-basis: 100%; margin: 4px 0 4px 28px; box-shadow: var(--shadow-1); border: 1px solid var(--line); }
  .route-fields:has(.results:not(.hidden)) .swap { display: none; }
  .mini { flex: none; width: 44px; height: 44px; border: 1.5px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 12px; display: grid; place-items: center; transition: background .15s, color .15s; }
  .mini:hover { background: var(--surface-2); color: var(--text); }
  .swap { position: absolute; right: 52px; top: 48px; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--bg); color: var(--muted); display: grid; place-items: center; z-index: 2; }
  .swap:hover { color: var(--text); background: var(--surface-2); }
  .route-fields .field input { padding-right: 40px; }

  .route-list { display: grid; gap: 8px; margin-top: 4px; }
  .route {
    border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 13px 14px; background: var(--bg); width: 100%; text-align: left; transition: border-color .15s, background .15s;
  }
  .route:hover { background: var(--surface-2); }
  .route[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
  .route .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .route .name { font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .route .score { font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .route .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .route .warn-line { display: flex; align-items: center; gap: 6px; color: var(--danger); font-size: 12.5px; margin-top: 8px; font-weight: 500; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--brand); color: var(--on-brand); letter-spacing: .02em; }
  .mix { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 10px; background: var(--line); gap: 2px; }
  .mix span { display: block; height: 100%; }
  .skeleton { height: 92px; border-radius: var(--r-md); background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .key { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; margin: 16px 0 0; font-size: 14px; }
  .key dt { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); }
  .key dd { margin: 0; align-self: center; }
  .key dd b { font-weight: 600; }
  .figures { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; margin-top: 16px; }
  .figures b { color: var(--text); }

  /* ---------- Trusted circle & walk together ---------- */
  .avatar { border-radius: 50%; color: #fff; font-weight: 700; display: grid; place-items: center; flex: none; font-size: 15px; }
  .contacts { display: grid; gap: 6px; }
  .contact { display: flex; align-items: center; gap: 12px; padding: 8px 4px 8px 10px; border: 1.5px solid var(--line); border-radius: var(--r-md); }
  .contact > div { flex: 1; min-width: 0; }
  .contact small { display: block; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .empty-state { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13.5px; padding: 12px; border: 1.5px dashed var(--line); border-radius: var(--r-md); }
  .count { color: var(--muted); font-weight: 400; font-size: 12.5px; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .add-contact { display: grid; gap: 8px; margin-top: 10px; }
  .add-contact input { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; font: inherit; font-size: 15px; background: var(--bg); color: var(--text); }
  .add-contact input:focus { border-color: var(--focus); outline: none; }
  .add-contact .btn { margin-top: 0; }
  .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .row-btns .btn { margin-top: 0; font-size: 14px; }
  .msg-preview { font-size: 13px; line-height: 1.5; padding: 12px; border-radius: var(--r-sm); background: var(--brand-soft); color: var(--text); word-break: break-word; }
  .targets { display: grid; gap: 6px; margin-top: 10px; }
  .target { display: flex; align-items: center; gap: 10px; }
  .t-name { flex: 1; font-weight: 600; font-size: 14px; }
  .mini-btn { border: 1.5px solid var(--line); background: var(--bg); color: var(--text); border-radius: 10px; padding: 7px 12px; font-size: 13px; font-weight: 600; text-decoration: none; transition: background .15s; }
  .mini-btn:hover { background: var(--surface-2); }
  .trip-card { border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 6px; font-size: 14px; }
  .trip-line { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .trip-line .dot { width: 10px; height: 10px; border-radius: 50%; }
  .trip-meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .trip-meta b { color: var(--text); }
  .trip-bar .i { color: var(--brand); }
  .trip-bar.late { background: color-mix(in srgb, var(--danger) 14%, var(--bg)); }
  .trip-bar.late .i { color: var(--danger); }
  .link-btn.call { color: var(--danger); text-decoration: none; }
  @media (max-width: 759px) { body:has(#sheet:not(.hidden)) .corner-logo { display: none; } }
  body:has(#tripBar:not(.hidden)) .corner-logo, body:has(#mapStatus:not(.hidden)) .corner-logo { display: none; }
  .mates { display: grid; gap: 10px; }
  .mate { border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 12px; }
  .mate .btn { margin-top: 10px; height: 44px; font-size: 14px; }
  .mate-top { display: flex; gap: 12px; align-items: center; }
  .mate-info { flex: 1; min-width: 0; }
  .mate-info b { font-size: 15px; }
  .mate-info small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .verified { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; font-size: 11.5px; font-weight: 600; color: var(--safe); vertical-align: 1px; }
  .verified .i { width: 13px; height: 13px; }
  .match { text-align: right; font-weight: 700; font-size: 18px; color: var(--brand); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .match small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .mate-meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-top: 10px; }
  .note.ok { background: color-mix(in srgb, var(--safe) 12%, var(--bg)); color: var(--text); margin-top: 10px; }
  .note.ok .i { color: var(--safe); }

  /* ---------- Popups and markers ---------- */
  .leaflet-container { font-family: var(--font); background: var(--map-bg); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--bg); color: var(--text); box-shadow: var(--shadow-2); }
  .leaflet-popup-content-wrapper { border-radius: var(--r-md); }
  .leaflet-popup-content { margin: 14px 16px; font-size: 13.5px; line-height: 1.45; min-width: 220px; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); top: 6px; right: 6px; }
  .pop-h { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; padding-right: 14px; }
  .pop-h .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .pop-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .pop-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--muted); font-size: 12px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .pop-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .pop-meta .i { width: 13px; height: 13px; }
  .pop q { display: block; margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: 13px; quotes: "“" "”"; }
  .pop-actions { display: flex; gap: 6px; margin-top: 12px; }
  .pop-actions button {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid var(--line); background: var(--bg);
    color: var(--text); border-radius: 10px; height: 36px; font-size: 13px; font-weight: 600; transition: background .15s;
  }
  .pop-actions button:hover { background: var(--surface-2); }
  .pop-actions button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  .status { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; }
  .status.verified { background: color-mix(in srgb, var(--safe) 15%, var(--bg)); color: var(--safe); }
  .status.pending { background: color-mix(in srgb, var(--heat-mid) 20%, var(--bg)); color: var(--mid); }
  .status.hidden { background: color-mix(in srgb, var(--danger) 14%, var(--bg)); color: var(--danger); }
  .me-dot { width: 18px; height: 18px; border-radius: 50%; background: #2563eb; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(37,99,235,.25), 0 1px 4px rgba(0,0,0,.3); }
  .pin { width: 30px; height: 30px; border-radius: 50%; color: #fff; font-weight: 700; display: grid; place-items: center; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); font-size: 13px; }
  .place-pin { width: 34px; height: 34px; display: grid; place-items: center; color: var(--brand); filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
  .place-pin svg { width: 34px; height: 34px; fill: var(--brand); stroke: #fff; stroke-width: 1.5; }
  .leaflet-tile.safety-tile { opacity: 1 !important; transition: none !important; }
  [data-theme="dark"] .basemap { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.5); }
  .leaflet-control-attribution { font-size: 10px; background: color-mix(in srgb, var(--bg) 80%, transparent) !important; color: var(--muted); }
  .leaflet-control-attribution a { color: var(--muted); }

  .toast {
    position: fixed; z-index: 1100; left: 50%; bottom: calc(var(--bottom) + 70px); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px);
    display: flex; align-items: center; gap: 10px; background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: var(--r-md);
    font-size: 14px; font-weight: 500; box-shadow: var(--shadow-2); animation: rise .25s var(--ease);
  }
</style>
</head>

    <button id="btnInfo" class="icon-btn" aria-label="How it works"><svg class="i"><use href="#i-info"/></svg></button>
  </div>
  <ul id="qResults" class="results hidden" role="listbox" aria-label="Results"></ul>
  <div class="modes" id="modes" role="group" aria-label="Time of day">
    <button data-mode="auto" aria-pressed="true"><svg class="i"><use href="#i-clock"/></svg>Now</button>
    <button data-mode="day" aria-pressed="false"><svg class="i"><use href="#i-sun"/></svg>Day</button>
    <button data-mode="night" aria-pressed="false"><svg class="i"><use href="#i-moon"/></svg>Night</button>
    <button data-mode="all" aria-pressed="false"><svg class="i"><use href="#i-all"/></svg>All</button>
  </div>
  <div id="mapStatus" class="status-bar hidden" role="status">
    <svg class="i"><use href="#i-alert"/></svg><span id="mapStatusText"></span>
    <button id="mapRetry" class="link-btn">Retry</button>
  </div>
  <div id="tripBar" class="status-bar trip-bar hidden" role="status">
    <svg class="i"><use href="#i-share"/></svg><span id="tripText"></span>
    <a id="tripCall" class="link-btn call hidden" href="tel:112">Call 112</a>
    <button id="tripDone" class="link-btn">I’ve arrived</button>
  </div>
</header>

<div class="controls">
  <div class="ctrl-group">
    <button id="zoomIn" class="zoom-only" aria-label="Zoom in"><svg class="i"><use href="#i-plus"/></svg></button>
    <button id="zoomOut" class="zoom-only" aria-label="Zoom out"><svg class="i"><use href="#i-minus"/></svg></button>
    <button id="btnLocate" aria-label="Go to my location"><svg class="i"><use href="#i-locate"/></svg></button>
    <button id="btnHeat" aria-label="Hide heat map" aria-pressed="true"><svg class="i"><use href="#i-layers"/></svg></button>
    <button id="btnCircle" aria-label="Trusted circle: share your location"><svg class="i"><use href="#i-users"/></svg></button>
  </div>
  <a href="tel:112" class="sos" aria-label="Emergency: call 112"><svg class="i"><use href="#i-phone"/></svg>112</a>
</div>

<section id="sheet" class="sheet hidden" role="dialog" aria-labelledby="sheetTitle">
  <div class="handle" aria-hidden="true"></div>
  <div id="sheetBody"></div>
</section>

<div class="legend" id="legend" aria-label="Legend">
  <div class="legend-title"><svg class="i" id="legendIcon"><use href="#i-clock"/></svg><span id="legendMode">Now</span></div>
  <div class="grad"></div>
  <div class="grad-lbls"><span>Safe</span><span>Medium</span><span>Unsafe</span></div>
</div>

<div class="actions" id="actions">
  <button id="btnRoute" class="pill"><svg class="i"><use href="#i-route"/></svg>Safe route</button>
  <button id="btnReport" class="pill primary"><svg class="i"><use href="#i-plus"/></svg>Report an area</button>
</div>

<div id="hint" class="hint hidden" role="status">
  <p><svg class="i"><use href="#i-pin"/></svg><span id="hintText"></span></p>
  <div class="hint-actions">
    <button id="hintMe" class="solid"><svg class="i sm"><use href="#i-locate"/></svg>My location</button>
    <button id="hintCancel" class="soft">Cancel</button>
  </div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
'use strict';

/* =====================================================================
   Utilities
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (name, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } }
};
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
function toast(msg, icon = 'check', ms = 3000) {
  const t = $('#toast'); t.innerHTML = ic(icon) + `<span>${esc(msg)}</span>`; t.classList.remove('hidden');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), ms);
}
function timeAgo(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60); if (h < 24) return `${h} h ago`;
  const d = Math.round(h / 24); return d === 1 ? '1 day ago' : `${d} days ago`;
}
const fmtDist = m => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`;
const fmtTime = s => { const m = Math.max(1, Math.round(s / 60)); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`; };
async function fetchJSON(url, ms = 12000, signal) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  signal?.addEventListener('abort', () => ctl.abort());
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}

/* =====================================================================
   Data model
   ===================================================================== */
const LEVELS = [
  { name: 'Safe', color: '#16a34a' },
  { name: 'Caution', color: '#eab308' },
  { name: 'Unsafe', color: '#dc2626' }
];
const CATS = {
  light: { t: 'Well lit', l: 0 },
  people: { t: 'Lots of people', l: 0 },
  shops: { t: 'Open shops', l: 0 },
  dark: { t: 'Poor lighting', l: 1 },
  empty: { t: 'Empty street', l: 1 },
  drunk: { t: 'Drunk people or fights', l: 1 },
  catcall: { t: 'Catcalling', l: 2 },
  followed: { t: 'I was followed', l: 2 },
  theft: { t: 'Theft or attempt', l: 2 },
  other: { t: 'Other reason', l: -1 }
};
const COMMENTS = ['Very dark street', 'Quite lively', 'Walked alone and felt fine', 'Group of men harassing people',
  'Lots of police around', 'I felt watched', 'Bars open late', 'Nobody around', '', '', '', ''];

// Seeded PRNG so the demo data is always the same
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* Sample areas: [lat, lng, daytime level, night-time level, spread]
   DEMO DATA: does not reflect real statistics. */
const DEMO_ZONES = [
  [41.3870, 2.1700, 0, 1, .003], [41.3925, 2.1650, 0, 0, .004], [41.3810, 2.1735, 0, 1, .002],
  [41.3790, 2.1690, 1, 2, .002], [41.3825, 2.1770, 0, 2, .002], [41.3790, 2.1925, 0, 2, .003],
  [41.3880, 2.1870, 0, 2, .002], [41.4030, 2.1570, 0, 1, .004], [41.3790, 2.1400, 0, 2, .003],
  [41.3740, 2.1620, 0, 2, .003], [41.3640, 2.1580, 0, 2, .004], [41.4036, 2.1744, 0, 1, .003],
  [41.3880, 2.1550, 0, 1, .005], [41.4000, 2.2000, 0, 2, .004], [41.3780, 2.1620, 0, 1, .003],
  [41.4100, 2.2160, 0, 2, .004], [41.3810, 2.1230, 0, 1, .004], [41.3860, 2.1640, 0, 0, .002],
  [41.3910, 2.1806, 0, 2, .002], [41.4110, 2.2210, 1, 2, .003], [41.3955, 2.1590, 0, 0, .004],
  [41.3985, 2.1460, 0, 1, .004], [41.4140, 2.1530, 0, 2, .003], [41.4180, 2.1820, 0, 2, .004],
  [41.3700, 2.1500, 0, 2, .004], [41.3955, 2.1890, 0, 2, .003], [41.4060, 2.1880, 0, 1, .004],
  [41.3850, 2.1820, 0, 2, .002], [41.3935, 2.1700, 0, 1, .003], [41.3830, 2.1580, 0, 2, .003],
  [41.3975, 2.1790, 0, 2, .003], [41.3900, 2.1500, 0, 1, .003]
];

/* Sample corridors: wide, well-lit avenues marked as safe at night.
   They give the "safe route" feature alternatives with clear differences. */
const DEMO_CORRIDORS = [
  [[41.3870, 2.1696], [41.3915, 2.1650], [41.3960, 2.1605], [41.4000, 2.1565]],                 // Passeig de Gràcia
  [[41.3866, 2.1683], [41.3910, 2.1637], [41.3953, 2.1592]],                                     // Rambla de Catalunya
  [[41.3752, 2.1495], [41.3805, 2.1567], [41.3858, 2.1640], [41.3900, 2.1697], [41.3945, 2.1755], [41.3990, 2.1815], [41.4035, 2.1870]], // Gran Via
  [[41.3925, 2.1430], [41.3945, 2.1520], [41.3960, 2.1600], [41.3985, 2.1660], [41.4005, 2.1720], [41.4035, 2.1870]], // Diagonal
  [[41.3870, 2.1700], [41.3820, 2.1735], [41.3770, 2.1775]],                                     // La Rambla
  [[41.3752, 2.1495], [41.3745, 2.1600], [41.3750, 2.1700], [41.3760, 2.1775]],                 // Paral·lel
  [[41.3910, 2.1806], [41.3960, 2.1745], [41.4030, 2.1660]],                                     // Passeig de Sant Joan
  [[41.3870, 2.1745], [41.3840, 2.1770], [41.3805, 2.1800]]                                      // Via Laietana
];

function buildDemo() {
  const rnd = mulberry32(2026);
  const out = []; let n = 0;
  const pick = lvl => { const k = Object.keys(CATS).filter(c => CATS[c].l === lvl); return k[Math.floor(rnd() * k.length)]; };
  const add = (lat, lng, lvl, night, confirms = Math.floor(rnd() * 7)) => out.push({
    id: 'demo' + (n++), lat, lng, level: lvl, night, cat: pick(lvl),
    comment: COMMENTS[Math.floor(rnd() * COMMENTS.length)],
    ts: Date.now() - Math.floor(rnd() * 45 * 864e5),
    confirms, flags: Math.floor(rnd() * 2), demo: true
  });
  const jitter = lvl => rnd() < .2 ? Math.max(0, Math.min(2, lvl + (rnd() < .5 ? -1 : 1))) : lvl;
  for (const [lat, lng, d, nt, s] of DEMO_ZONES) {
    for (let i = 0; i < 12; i++) {
      const night = i % 2 === 1;
      add(lat + (rnd() - .5) * s * 2, lng + (rnd() - .5) * s * 2.6, jitter(night ? nt : d), night);
    }
  }
  // Background: almost all safe by day; much more yellow and red at night
  for (let i = 0; i < 220; i++) {
    const night = i % 2 === 1, r = rnd();
    const lvl = night ? (r < .25 ? 0 : r < .62 ? 1 : 2) : (r < .9 ? 0 : 1);
    add(41.368 + rnd() * .048, 2.128 + rnd() * .085, lvl, night);
  }
  // Safe corridors: one verified point every ~60 m
  for (const line of DEMO_CORRIDORS) {
    for (let i = 0; i < line.length - 1; i++) {
      const [a, b] = [line[i], line[i + 1]];
      const steps = Math.max(1, Math.round(Math.hypot((b[0] - a[0]) * 111320, (b[1] - a[1]) * 83500) / 60));
      for (let k = 0; k < steps; k++) {
        const lat = a[0] + (b[0] - a[0]) * k / steps + (rnd() - .5) * .0002;
        const lng = a[1] + (b[1] - a[1]) * k / steps + (rnd() - .5) * .0002;
        add(lat, lng, rnd() < .9 ? 0 : 1, true, 3 + Math.floor(rnd() * 5));
        if (k % 2 === 0) add(lat, lng, 0, false, 3 + Math.floor(rnd() * 5));
      }
    }
  }
  return out;
}

/* Community moderation:
   - A new report stays "pending" (low weight) until it has 2 confirmations.
   - If 3+ people flag it as fake and there are more flags than confirmations, it is hidden. */
function evaluate(r) {
  const v = votes[r.id];
  const confirms = r.confirms + (v === 'up' ? 1 : 0);
  const flags = r.flags + (v === 'down' ? 1 : 0);
  let status = 'verified', w = Math.min(1, .5 + .1 * confirms);
  if (flags >= 3 && flags > confirms) { status = 'hidden'; w = 0; }
  else if (confirms < 2) { status = 'pending'; w = .35; }
  return { ...r, confirms, flags, status, w, score: r.level / 2 };
}

/* =====================================================================
   Safety at a point (distance-weighted Gaussian average)
   ===================================================================== */
const M_LAT = 111320, M_LNG = 111320 * Math.cos(41.39 * Math.PI / 180);
const SIGMA = 170, RADIUS = SIGMA * 3, R2 = RADIUS * RADIUS, S2 = 2 * SIGMA * SIGMA;
function sampleAt(lat, lng, list = active) {
  let sw = 0, ss = 0;
  for (const r of list) {
    const dy = (r.lat - lat) * M_LAT, dx = (r.lng - lng) * M_LNG, d2 = dx * dx + dy * dy;
    if (d2 > R2) continue;
    const w = r.w * Math.exp(-d2 / S2);
    sw += w; ss += w * r.score;
  }
  return sw ? { score: ss / sw, conf: sw } : { score: null, conf: 0 };
}

  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}

// Heat layer: each tile is painted by interpolating the score of nearby reports
const SafetyLayer = L.GridLayer.extend({
  createTile(coords) {
    const size = this.getTileSize();
    const tile = L.DomUtil.create('canvas', 'safety-tile');
    tile.width = size.x; tile.height = size.y;
    const origin = coords.scaleBy(size);
    const nw = map.unproject(origin, coords.z), se = map.unproject(origin.add(size), coords.z);
    const pLat = RADIUS / M_LAT, pLng = RADIUS / M_LNG;
    const list = active.filter(r => r.lat < nw.lat + pLat && r.lat > se.lat - pLat && r.lng > nw.lng - pLng && r.lng < se.lng + pLng);
    if (!list.length) return tile;
    // 33×33 samples at x·8 px (including edges 0 and 256): neighbouring tiles share
    // exactly the same edge values, so no seams are visible.
    const N = 32, M = N + 1, step = size.x / N;
    const small = document.createElement('canvas'); small.width = M; small.height = M;
    const sctx = small.getContext('2d'), img = sctx.createImageData(M, M);
    // Lower the opacity when zoomed in so the streets stay readable
    const alphaMax = (darkScene() ? 170 : 150) * (coords.z >= 17 ? .55 : coords.z >= 16 ? .75 : 1);
    for (let y = 0; y < M; y++) {
      for (let x = 0; x < M; x++) {
        const ll = map.unproject(origin.add(L.point(x * step, y * step)), coords.z);
        const s = sampleAt(ll.lat, ll.lng, list);
        if (!s.conf) continue;
        const [r, g, b] = rgb(s.score), i = (y * M + x) * 4;
        img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b;
        img.data[i + 3] = Math.min(1, s.conf / .9) * alphaMax;
      }
    }
    sctx.putImageData(img, 0, 0);
    const ctx = tile.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(small, -step / 2, -step / 2, M * step, M * step);
    return tile;
  }
});

// Small edit distance (typo tolerance), comparing the token with the start of the word
function near(t, w) {
  if (t.length < 5) return false;
  const maxD = t.length >= 7 ? 2 : 1, s = w.slice(0, t.length + 1);
  const dp = Array.from({ length: t.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= s.length; j++) dp[0][j] = j;
  for (let i = 1; i <= t.length; i++) for (let j = 1; j <= s.length; j++)
    dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (t[i - 1] === s[j - 1] ? 0 : 1));
  return Math.min(dp[t.length][s.length], dp[t.length][Math.max(0, s.length - 1)]) <= maxD;
}
function localSearch(q) {
  const tk = tokens(q); if (!tk.length) return [];
  const scored = [];

    const words = p.key.split(/[\s'’·-]+/);
    let score = 0, ok = true;
    for (const t of tk) {
      if (words.some(w => w === t)) score += 3;
      else if (words.some(w => w.startsWith(t))) score += 2;
      else if (t.length >= 4 && p.key.includes(t)) score += 1;
      else if (words.some(w => near(t, w))) score += 1;
      else { ok = false; break; }
    }
    if (ok) scored.push([score + (norm(p.label).startsWith(tk[0]) ? 2 : 0), p]);
  }
  return scored.sort((a, b) => b[0] - a[0]).slice(0, 4).map(x => x[1]);
}

  'post_box', 'information', 'board', 'guidepost', 'bicycle_parking', 'parking_entrance', 'charging_station', 'atm', 'telephone',
  'toilets', 'drinking_water', 'fire_hydrant', 'street_lamp', 'surveillance', 'motorcycle_parking', 'bicycle_rental', 'yes']);
const STATION = new Set(['station', 'train_station', 'subway_entrance', 'halt', 'tram_stop']);

function photonPlace(f) {
  const p = f.properties, [lng, lat] = f.geometry.coordinates;
  const street = [p.street, p.housenumber].filter(Boolean).join(' ');
  const isStreet = p.type === 'street' || p.osm_key === 'highway';
  const label = p.name || street || p.district || p.locality;
  if (!label || (p.city && p.city !== 'Barcelona')) return null;
  const area = [p.locality, p.district].filter((x, i, a) => x && a.indexOf(x) === i && x !== label).slice(0, 1).join('');
  const sub = [p.name && street && street !== label ? street : null, area].filter(Boolean).join(' · ') || p.city || 'Barcelona';
  const kind = STATION.has(p.osm_value) ? 'station' : isStreet ? 'street' : p.type === 'district' || p.type === 'locality' ? 'area' : 'place';
  return { label, sub, latlng: L.latLng(lat, lng), kind, osm: p.osm_value, stop: p.osm_value === 'stop' || p.osm_value === 'bus_stop' || p.osm_value === 'platform' };
}

async function photon(q, signal) {
  const c = map.getCenter();
  const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=12&lang=en&lat=${c.lat.toFixed(4)}&lon=${c.lng.toFixed(4)}&location_bias_scale=0.4&bbox=${BCN_BBOX}`;
  const data = await fetchJSON(url, 8000, signal);
  return (data.features || []).map(photonPlace).filter(p => p && !NOISE.has(p.osm) && inBcn(p.latlng));
}
async function nominatim(q, signal) {
  const data = await fetchJSON(`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&accept-language=en&bounded=1&viewbox=2.05,41.47,2.25,41.31&q=${encodeURIComponent(q)}`, 8000, signal);
  return data.filter(x => !x.address?.city || x.address.city === 'Barcelona').map(x => {
    const a = x.address || {}, street = [a.road, a.house_number].filter(Boolean).join(' ');
    const label = x.name || street || x.display_name.split(',')[0];
    const sub = [x.name && street ? street : null, a.suburb || a.city_district].filter(Boolean).join(' · ') || 'Barcelona';
    return { label, sub, latlng: L.latLng(+x.lat, +x.lon), kind: x.category === 'highway' ? 'street' : 'place' };
  });
}

// Merge and remove duplicates: same name nearby, or the same street split into several segments
function dedupe(list) {
  const out = [];
  for (const p of list) {
    const n = norm(p.label);
    const dup = out.find(o => norm(o.label) === n && (p.kind === 'street' && o.kind === 'street' || o.latlng.distanceTo(p.latlng) < 400));
    if (!dup) out.push(p);
  }
  return out;
}
const searchCache = new Map();
async function remoteSearch(q, signal) {
  const key = norm(q).trim();
  if (searchCache.has(key)) return searchCache.get(key);
  let res = [];
  for (let attempt = 0; attempt < 2; attempt++) {
    try { res = await photon(q, signal); break; }
    catch (e) { if (signal.aborted) throw e; await new Promise(r => setTimeout(r, 500)); }
  }
  if (!res.length && q.length >= 4) res = await nominatim(q, signal);
  // Real stations and named places before bus/metro stop duplicates
  // Results whose name contains more of the typed words go first (stable), bus/metro stop duplicates last
  const tk = tokens(q), hits = p => tk.filter(x => norm(p.label).includes(x)).length;
  res = res.map((p, i) => [p, i]).sort((x, y) => (x[0].stop - y[0].stop) || (hits(y[0]) - hits(x[0])) || (x[1] - y[1])).map(x => x[0]);
  res = dedupe(res).slice(0, 6);
  searchCache.set(key, res);
  return res;
}

// Recent searches (per device)
const recent = {
  get: () => store.get('safemap.recent', []).map(r => ({ ...r, latlng: L.latLng(r.lat, r.lng), kind: 'recent' })),
  add(p) {
    if (p.kind === 'me') return;
    const list = store.get('safemap.recent', []).filter(r => r.label !== p.label);
    list.unshift({ label: p.label, sub: p.sub || '', lat: p.latlng.lat, lng: p.latlng.lng });
    store.set('safemap.recent', list.slice(0, 5));
  }
};

const KIND_ICON = { station: 'train', street: 'road', area: 'map', recent: 'clock', me: 'locate', place: 'pin' };
function highlight(label, q) {
  const n = norm(label), mark = new Array(label.length).fill(false);
  for (const t of tokens(q)) {
    let i = -1;
    while ((i = n.indexOf(t, i + 1)) !== -1) { if (i === 0 || /[\s'’·(-]/.test(n[i - 1])) { for (let k = i; k < i + t.length; k++) mark[k] = true; break; } }
  }
  let html = '', open = false;
  [...label].forEach((c, i) => {
    if (mark[i] && !open) { html += '<b>'; open = true; }
    if (!mark[i] && open) { html += '</b>'; open = false; }
    html += esc(c);
  });
  return html + (open ? '</b>' : '');
}

/* Autocomplete for any input + <ul>. opts.withMe adds a "My location" option. */
function autocomplete(input, list, onPick, opts = {}) {
  let items = [], active = -1, ctl = null, seq = 0, pickWhenReady = false, loading = false;
  const meItem = () => ({ label: 'My location', sub: meLatLng ? 'Use your current position' : 'Uses your device’s GPS', kind: 'me' });

  function render(q, note) {
    if (!items.length && !note) { list.classList.add('hidden'); return; }
    list.innerHTML = items.map((p, i) => `<li role="option" id="${list.id}_${i}" data-i="${i}" aria-selected="${i === active}" class="${i === active ? 'active' : ''}">
        ${ic(KIND_ICON[p.kind] || 'pin')}<div>${q ? highlight(p.label, q) : esc(p.label)}<small>${esc(p.sub || '')}</small></div></li>`).join('')
      + (note ? `<li class="empty">${note}</li>` : '');
    list.classList.remove('hidden');
    input.setAttribute('aria-activedescendant', active >= 0 ? `${list.id}_${active}` : '');
    if (list.closest('.sheet')) list.scrollIntoView({ block: 'nearest' });
    $$('li[data-i]', list).forEach(li => {
      li.onmousedown = e => e.preventDefault(); // keep focus in the input
      li.onclick = () => choose(+li.dataset.i);
    });
  }
  async function choose(i) {
    const p = items[i]; if (!p) return;
    list.classList.add('hidden'); pickWhenReady = false;
    if (p.kind === 'me') {
      try { const ll = await locate(false); onPick({ label: 'My location', latlng: ll, kind: 'me' }); } catch { /* toast already shown */ }
      return;
    }
    recent.add(p);
    onPick(p);
  }
  function showDefault() {
    items = [...(opts.withMe ? [meItem()] : []), ...recent.get()];
    active = -1;
    render('', items.length ? null : null);
  }
  const runRemote = debounce(async (q, my) => {
    ctl?.abort(); ctl = new AbortController();
    try {
      const res = await remoteSearch(q, ctl.signal);
      if (my !== seq) return;
      loading = false;
      const local = localSearch(q);
      items = dedupe([...local, ...res]).slice(0, 7);
      if (opts.withMe && 'my location'.startsWith(norm(q))) items.unshift(meItem());
      active = items.length ? Math.max(active, 0) : -1;
      render(q, items.length ? null : 'No results in Barcelona. Try a street name and number, or a place.');
      if (pickWhenReady && items.length) choose(0);
    } catch (e) {
      if (my !== seq || ctl.signal.aborted && e.name === 'AbortError') return;
      loading = false;
      render(q, items.length ? 'Online search unavailable — showing saved places.' : 'Search failed. Check your connection and try again.');
    }
  }, 220);

  function onInput() {
    const q = input.value.trim(), my = ++seq;
    opts.onInput?.(q);
    if (!q) { ctl?.abort(); loading = false; showDefault(); return; }
    // Instant local suggestions while the online search runs
    items = localSearch(q);
    if (opts.withMe && 'my location'.startsWith(norm(q))) items.unshift(meItem());
    active = items.length ? 0 : -1;
    if (q.length < 2) { render(q, null); return; }
    loading = true;
    render(q, '<span class="searching">Searching…</span>');
    runRemote(q, my);
  }
  input.addEventListener('input', onInput);
  input.addEventListener('focus', () => { if (!input.value.trim()) showDefault(); else if (items.length) render(input.value.trim()); });
  input.addEventListener('blur', () => setTimeout(() => list.classList.add('hidden'), 150));
  input.addEventListener('keydown', e => {
    const n = items.length;
    if (e.key === 'ArrowDown' && n) { e.preventDefault(); active = (active + 1) % n; render(input.value.trim(), loading ? '<span class="searching">Searching…</span>' : null); }
    else if (e.key === 'ArrowUp' && n) { e.preventDefault(); active = (active - 1 + n) % n; render(input.value.trim(), loading ? '<span class="searching">Searching…</span>' : null); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (n && !loading) choose(active >= 0 ? active : 0);
      else if (n && active >= 0 && localSearch(input.value).length) choose(active);
      else pickWhenReady = true;
    }
    else if (e.key === 'Escape') { list.classList.add('hidden'); }
  });
  input.setAttribute('role', 'combobox');
  input.setAttribute('aria-autocomplete', 'list');
  input.setAttribute('aria-controls', list.id);
}
let searchMarker = null;
const placeIcon = L.divIcon({ className: '', html: `<div class="place-pin"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3" fill="#fff"/></svg></div>`, iconSize: [34, 34], iconAnchor: [17, 32], popupAnchor: [0, -28] });

const routeState = { from: null, to: null, results: null, sel: 0, layers: null, loading: false, error: false, bestIdx: 0 };
const ROUTE_COLORS = { g: '#16a34a', y: '#eab308', r: '#dc2626', u: '#94a3b8' };

async function calcRoutes() {
  const s = routeState, a = s.from.latlng, b = s.to.latlng;
  s.loading = true; s.error = false; s.results = null; clearRouteLayers(); renderRouteSheet();
  try {
    const json = await fetchJSON(`https://routing.openstreetmap.de/routed-foot/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson&alternatives=true`, 15000);
    if (json.code !== 'Ok' || !json.routes?.length) throw new Error('route');
    s.results = json.routes.slice(0, 3).map(r => ({ distance: r.distance, duration: r.duration, coords: r.geometry.coordinates.map(([lng, lat]) => [lat, lng]) }));
    analyzeRoutes();
    s.sel = s.bestIdx;
    s.loading = false;
    drawRoutes(); renderRouteSheet();
    const wide = innerWidth >= 760;
    map.fitBounds(L.latLngBounds(s.results.flatMap(r => r.coords)), { paddingTopLeft: [wide ? 440 : 30, wide ? 130 : 120], paddingBottomRight: [70, wide ? 40 : innerHeight * .5] });
  } catch {
    s.loading = false; s.error = true; renderRouteSheet();
  }
}

function distM(a, b) { const dy = (a[0] - b[0]) * M_LAT, dx = (a[1] - b[1]) * M_LNG; return Math.hypot(dx, dy); }
function analyze(coords) {
  const pts = [];
  for (let i = 0; i < coords.length - 1; i++) {
    const a = coords[i], b = coords[i + 1], n = Math.max(1, Math.ceil(distM(a, b) / 20));
    for (let k = 0; k < n; k++) pts.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
  }
  pts.push(coords[coords.length - 1]);
  const segs = [], count = { g: 0, y: 0, r: 0, u: 0 };
  let cur = null, sum = 0, known = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const smp = sampleAt(pts[i][0], pts[i][1]);
    const sc = smp.conf > .15 ? smp.score : null;
    const cls = sc == null ? 'u' : ['g', 'y', 'r'][levelOf(sc)];
    if (sc != null) { sum += sc; known++; }
    count[cls]++;
    if (!cur || cur.cls !== cls) { cur = { cls, pts: [pts[i]] }; segs.push(cur); }
    cur.pts.push(pts[i + 1]);
  }
  const total = Math.max(1, pts.length - 1);
  const share = { g: count.g / total, y: count.y / total, r: count.r / total, u: count.u / total };
  const avg = known ? sum / known : null;
  return { segs, share, avg, safety: avg == null ? null : Math.round((1 - avg) * 100) };
}
function analyzeRoutes() {
  const s = routeState; if (!s.results) return;
  const minD = Math.min(...s.results.map(r => r.distance));
  let best = 0, bestRisk = Infinity;
  s.results.forEach((r, i) => {
    r.analysis = analyze(r.coords);
    const a = r.analysis;
    const risk = (a.avg ?? .4) + .8 * a.share.r + .25 * a.share.y + .3 * (r.distance / minD - 1);
    if (risk < bestRisk) { bestRisk = risk; best = i; }
  });
  s.bestIdx = best;
}
function clearRouteLayers() { if (routeState.layers) { map.removeLayer(routeState.layers); routeState.layers = null; } }
function drawRoutes() {
  const s = routeState; clearRouteLayers();
  if (!s.results) return;
  const g = L.layerGroup();
  s.results.forEach((r, i) => {
    if (i === s.sel) return;
    L.polyline(r.coords, { color: '#64748b', weight: 6, opacity: .6, dashArray: '1 10', lineCap: 'round' })
      .on('click', () => { s.sel = i; drawRoutes(); renderRouteSheet(); }).addTo(g);
  });
  const r = s.results[s.sel];
  L.polyline(r.coords, { color: '#fff', weight: 12, opacity: .95 }).addTo(g);
  r.analysis.segs.forEach(sg => L.polyline(sg.pts, { color: ROUTE_COLORS[sg.cls], weight: 7, opacity: 1, lineCap: 'round' }).addTo(g));
  L.marker(s.from.latlng, { icon: pinIcon('A', '#2563eb') }).addTo(g);
  L.marker(s.to.latlng, { icon: pinIcon('B', '#5b21b6') }).addTo(g);
  s.layers = g.addTo(map);
}

/* =====================================================================
   Trusted circle: share location / trip with people you trust
   Messages are only sent when the user taps WhatsApp, SMS or Share.
   ===================================================================== */
let contacts = store.get('safemap.contacts', []);
let trip = store.get('safemap.trip', null);
const fmtClock = ts => new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const mapLink = ll => `https://maps.google.com/?q=${ll.lat.toFixed(5)},${ll.lng.toFixed(5)}`;
const digits = p => p.replace(/[^\d+]/g, '').replace(/^00/, '+');
const AVATAR_COLORS = ['#7c3aed', '#db2777', '#0891b2', '#ea580c', '#16a34a', '#4f46e5', '#be123c', '#0d9488'];
const avatar = (name, size = 36) => {
  const c = AVATAR_COLORS[[...name].reduce((a, ch) => a + ch.charCodeAt(0), 0) % AVATAR_COLORS.length];
  return `<span class="avatar" style="width:${size}px;height:${size}px;background:${c}">${esc(name.trim()[0] || '?').toUpperCase()}</span>`;
};

function shareTargets(msg) {
  const enc = encodeURIComponent(msg);
  return `<div class="msg-preview">${esc(msg)}</div>
    ${contacts.length ? `<div class="targets">${contacts.map((c, i) => `<div class="target">
        ${avatar(c.name, 32)}<span class="t-name">${esc(c.name)}</span>
        <a class="mini-btn" href="https://wa.me/${digits(c.phone).replace('+', '')}?text=${enc}" target="_blank" rel="noopener">WhatsApp</a>
        <a class="mini-btn" href="sms:${esc(digits(c.phone))}?&body=${enc}">SMS</a></div>`).join('')}</div>`
      : `<p class="lede" style="font-size:13px">Add trusted contacts to send this in one tap.</p>`}
    <div class="row-btns">
      ${navigator.share ? `<button class="btn soft" data-share>${ic('share')}Share via…</button>` : ''}
      <button class="btn soft" data-copy>${ic('copy')}Copy message</button>
    </div>`;
}
function bindShare(root, msg) {
  const s = $('[data-share]', root), c = $('[data-copy]', root);
  if (s) s.onclick = () => navigator.share({ text: msg }).catch(() => {});
  if (c) c.onclick = () => (navigator.clipboard?.writeText(msg) || Promise.reject()).then(() => toast('Message copied', 'copy')).catch(() => toast('Couldn’t copy. Select the text and copy it.', 'alert'));
}

function openCircle(prefillMsg) {
  openSheet('circle', `${sheetHead('Trusted circle')}
    <p class="lede">Share where you are with people you trust. Nothing is sent until you tap WhatsApp, SMS or Share.</p>
    <h3>Your contacts <span class="count">${contacts.length}/5</span></h3>
    <div class="contacts">${contacts.length ? contacts.map((c, i) => `<div class="contact">${avatar(c.name)}
        <div><b>${esc(c.name)}</b><small>${esc(c.phone)}</small></div>
        <button class="icon-btn" data-del="${i}" aria-label="Remove ${esc(c.name)}">${ic('trash', 'sm')}</button></div>`).join('')
      : `<div class="empty-state">${ic('users')}<span>No contacts yet. Add a friend, partner or family member.</span></div>`}</div>
    ${contacts.length < 5 ? `<form class="add-contact" id="addContact" autocomplete="off">
        <label class="sr" for="cName">Name</label><input id="cName" placeholder="Name" maxlength="30" required>
        <label class="sr" for="cPhone">Phone</label><input id="cPhone" type="tel" placeholder="Phone, e.g. +34 600 000 000" maxlength="20" required>
        <button class="btn soft" type="submit">${ic('plus')}Add contact</button></form>` : ''}
    <h3>Send a quick message</h3>
    <div class="row-btns">
      <button class="btn" id="shareLoc">${ic('locate')}Share my location</button>
      <button class="btn soft" id="shareSafe">${ic('check')}I got home safe</button>
    </div>
    <div id="shareOut"></div>`);
  const body = $('#sheetBody');
  $$('[data-del]', body).forEach(b => b.onclick = () => { contacts.splice(+b.dataset.del, 1); store.set('safemap.contacts', contacts); openCircle(); });
  const form = $('#addContact');
  if (form) form.onsubmit = e => {
    e.preventDefault();
    const name = $('#cName').value.trim(), phone = $('#cPhone').value.trim();
    if (!name || digits(phone).replace('+', '').length < 6) { toast('Enter a name and a valid phone number', 'alert'); return; }
    contacts.push({ name, phone }); store.set('safemap.contacts', contacts); openCircle();
    toast(`${name} added to your trusted circle`, 'heart');
  };
  const show = msg => { $('#shareOut').innerHTML = '<h3>Send it to</h3>' + shareTargets(msg); bindShare($('#shareOut'), msg); $('#shareOut').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
  $('#shareLoc').onclick = () => {
    $('#shareLoc').disabled = true;
    locate(false).then(ll => show(`I'm sharing my location with you from SafeHer: ${mapLink(ll)} (sent at ${fmtClock(Date.now())}).`))
      .catch(() => {}).finally(() => { if ($('#shareLoc')) $('#shareLoc').disabled = false; });
  };
  $('#shareSafe').onclick = () => { endTrip(); show(`I got home safe. Thanks for keeping an eye on me 💜`); };
  if (prefillMsg) show(prefillMsg);
}

/* ---- Share a trip + arrival check-in ---- */
function openShareTrip() {
  const s = routeState, r = s.results[s.sel], eta = Date.now() + r.duration * 1000;
  const msg = `I'm walking from ${s.from.label} to ${s.to.label} with SafeHer. Expected arrival around ${fmtClock(eta)} (${fmtTime(r.duration)}). `
    + `Route: https://www.openstreetmap.org/directions?engine=fossgis_osrm_foot&route=${s.from.latlng.lat.toFixed(5)},${s.from.latlng.lng.toFixed(5)};${s.to.latlng.lat.toFixed(5)},${s.to.latlng.lng.toFixed(5)} . I'll text you when I arrive.`;
  trip = { to: s.to.label, eta, started: Date.now() }; store.set('safemap.trip', trip); renderTrip();
  openSheet('share', `${sheetHead('Share your trip')}
    <div class="trip-card">
      <div class="trip-line"><span class="dot" style="background:#2563eb"></span>${esc(s.from.label)}</div>
      <div class="trip-line"><span class="dot" style="background:#5b21b6"></span>${esc(s.to.label)}</div>
      <div class="trip-meta">${ic('clock', 'sm')}Arriving around <b>${fmtClock(eta)}</b> · ${fmtDist(r.distance)}${r.analysis.safety != null ? ` · ${r.analysis.safety}% safety` : ''}</div>
    </div>
    <p class="lede" style="font-size:13px">We'll remind you to check in when you arrive. If you don't, SafeHer will ask if you're OK.</p>
    <h3>Send it to</h3>${shareTargets(msg)}
    <button class="btn soft" id="backRoute">${ic('route')}Back to the route</button>
    ${contacts.length ? '' : `<button class="btn" id="goCircle">${ic('users')}Add trusted contacts</button>`}`);
  bindShare($('#sheetBody'), msg);
  $('#backRoute').onclick = renderRouteSheet;
  if ($('#goCircle')) $('#goCircle').onclick = () => openCircle(msg);
}
function endTrip() { trip = null; store.set('safemap.trip', null); renderTrip(); }
function renderTrip() {
  const bar = $('#tripBar');
  if (!trip) { bar.classList.add('hidden'); return; }
  if (Date.now() - trip.eta > 3 * 3600e3) { endTrip(); return; } // forget very old trips
  const late = Date.now() > trip.eta + 5 * 60e3;
  bar.classList.toggle('late', late);
  $('#tripText').innerHTML = late
    ? `<b>Are you OK?</b> You were due at ${fmtClock(trip.eta)}.`
    : `Trip shared · arriving ~${fmtClock(trip.eta)}`;
  $('#tripCall').classList.toggle('hidden', !late);
  bar.classList.remove('hidden');
}
$('#tripDone').onclick = () => { const msg = `I've arrived safely${trip ? ' at ' + trip.to : ''}. Thanks for keeping an eye on me 💜`; endTrip(); openCircle(msg); };
setInterval(renderTrip, 30000);
renderTrip();
$('#btnCircle').onclick = () => openCircle();

/* =====================================================================
   Walk together: women with a similar route (simulated in this prototype)
   ===================================================================== */
const walkState = { req: {} };
function companions() {
  const s = routeState, a = s.from.latlng, b = s.to.latlng;
  const rnd = mulberry32(Math.round(a.lat * 1e4) * 31 + Math.round(b.lng * 1e4));
  const NAMES = ['Laura', 'Marta', 'Aïcha', 'Sofía', 'Júlia', 'Noa', 'Carla', 'Irene', 'Paula', 'Mei', 'Lucía', 'Fatima'];
  const ABOUT = ['UB student', 'UPF student', 'UPC student', 'Nurse at Hospital Clínic', 'Works in the Eixample', 'Erasmus student', 'Lives in Gràcia', 'Bartender, finishes late'];
  const n = 3 + Math.floor(rnd() * 3), used = new Set(), out = [];
  for (let i = 0; i < n; i++) {
    let name; do { name = NAMES[Math.floor(rnd() * NAMES.length)]; } while (used.has(name)); used.add(name);
    const off = () => (rnd() - .5) * .008;
    const start = L.latLng(a.lat + off(), a.lng + off()), end = L.latLng(b.lat + off(), b.lng + off());
    const overlap = Math.max(.35, Math.min(.97, 1 - (a.distanceTo(start) + b.distanceTo(end)) / 1800));
    out.push({
      id: name, name, age: 19 + Math.floor(rnd() * 14), about: ABOUT[Math.floor(rnd() * ABOUT.length)],
      verified: rnd() < .85, rating: (4.6 + rnd() * .4).toFixed(1), walks: 2 + Math.floor(rnd() * 40),
      leaves: [0, 5, 10, 15, 20, 30][Math.floor(rnd() * 6)], overlap
    });
  }
  return out.sort((x, y) => y.overlap - x.overlap);
}
function meetingPoint() {
  const from = routeState.from.latlng;
  let best = null, d = 700;
  for (const p of LANDMARKS) { const k = from.distanceTo(p.latlng); if (k < d && p.kind !== 'area') { d = k; best = p.label; } }
  return best || 'your starting point';
}
function openWalk() {
  const s = routeState, list = companions(), meet = meetingPoint();
  openSheet('walk', `${sheetHead('Walk together')}
    <p class="lede">Women heading the same way as you, right now. Walking with someone is one of the best ways to feel safer at night.</p>
    <div class="mates">${list.map(m => {
      const st = walkState.req[m.id];
      return `<div class="mate">
        <div class="mate-top">${avatar(m.name, 44)}
          <div class="mate-info"><b>${esc(m.name)}, ${m.age}</b>${m.verified ? `<span class="verified">${ic('shield', 'sm')}Verified</span>` : ''}
            <small>${esc(m.about)} · ★ ${m.rating} · ${m.walks} walks</small></div>
          <span class="match">${Math.round(m.overlap * 100)}%<small>same route</small></span></div>
        <div class="mate-meta">${ic('clock', 'sm')}${m.leaves ? `Leaving in ${m.leaves} min` : 'Leaving now'}</div>
        ${st === 'ok' ? `<div class="note ok">${ic('check')}<span><b>${esc(m.name)} accepted.</b> Meet at <b>${esc(meet)}</b>, a busy, well-lit spot. Share your trip with your trusted circle before you go.</span></div>
            <button class="btn soft" data-sharetrip>${ic('share')}Share trip</button>`
        : st === 'wait' ? `<button class="btn soft" disabled><span class="searching">Waiting for ${esc(m.name)}…</span></button>`
        : `<button class="btn" data-ask="${esc(m.id)}" ${m.verified ? '' : 'disabled title="Only verified profiles can be contacted"'}>${ic('users')}${m.verified ? 'Ask to walk together' : 'Not verified yet'}</button>`}
      </div>`;
    }).join('')}</div>
    <div class="note">${ic('lock')}<span><b>Safety first.</b> Only verified women can join. You only see first names, never addresses, and you always meet in a public place.</span></div>
    <div class="note warn">${ic('alert')}<span><b>Demo.</b> These profiles are simulated to show how the feature would work.</span></div>
    <button class="btn soft" id="backRoute">${ic('route')}Back to the route</button>`);
  $$('[data-ask]').forEach(b => b.onclick = () => {
    const id = b.dataset.ask; walkState.req[id] = 'wait'; openWalk();
    setTimeout(() => { walkState.req[id] = 'ok'; if (sheetKind === 'walk') openWalk(); toast(`${id} wants to walk with you`, 'heart'); }, 2500);
  });
  $$('[data-sharetrip]').forEach(b => b.onclick = openShareTrip);
  $('#backRoute').onclick = renderRouteSheet;
}

});

document.addEventListener('keydown', e => {

});
document.addEventListener('click', e => { if (!e.target.closest('.topbar')) $('#qResults').classList.add('hidden'); });

$('#q').addEventListener('input', () => $('#qClear').classList.toggle('hidden', !$('#q').value));
$('#qClear').onclick = () => { $('#q').value = ''; $('#qClear').classList.add('hidden'); $('#q').focus(); $('#q').dispatchEvent(new Event('input')); };

// Direct links: ?mode=night | day | all (Spanish ?modo=noche | dia | todo also works)
const qp = new URLSearchParams(location.search);
const urlMode = { noche: 'night', dia: 'day', todo: 'all', night: 'night', day: 'day', all: 'all' }[qp.get('mode') || qp.get('modo')];
